<app-auth-layout
  title="Login"
  subtitle="Por favor, faça login para continuar."
  btnPrimary="Entrar"
  footerText="Não tem uma conta?"
  footerLinkText="Cadastre-se aqui"
  footerLink="/register"
  >
  <form action="" class="formulario">
    <app-input-label
      label="Email"
      type="email"
      name="email"
      id="email"
      placeholder="Digite seu email">
      <app-icon name="mail"></app-icon>
    </app-input-label>

    <app-input-label
      label="Senha"
      type="password"
      name="password"
      id="password"
      placeholder="Digite sua senha">
      <app-icon name="lock"></app-icon>
    </app-input-label>
    <div class="remember">
      <input
        type="checkbox"
        id="login-remember"
        formControlName="rememberMe" />
      <label for="login-remember">Lembrar-me</label>
    </div>
  </form>
</app-auth-layout>
