<app-auth-layout
  title="Welcome Back"
  subtitle="Please sign in to continue"
  btnPrimary="Sign In"
  btnSecondary="Register"
>
  <form action="">
    <app-input-label
      label="Email"
      icon="fa fa-envelope"
      type="email"
      name="email"
      id="email"
      placeholder="Enter your email"
    ></app-input-label>
    <app-input-label
      label="Password"
      icon="fa fa-lock"
      type="password"
      name="password"
      id="password"
      placeholder="Enter your password"
    ></app-input-label>
  </form>
</app-auth-layout>
