<div class="content">
  <label 
    [attr.for]="id" 
    class="label"
    >
    {{ label }}
  </label>
  <div class="wrapper-inp">
    <i class="{{ icon }}"></i>
    <input 
      [type]="type"
      [name]="name"
      [id]="id"
      [placeholder]="placeholder"
      class="input" 
    />
  </div>
</div>
