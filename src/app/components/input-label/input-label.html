<div class="content">
  <label [for]="id">
    {{ label }}
  </label>

  <div class="wrapper-inp">
    <div class="icon">
      <ng-content></ng-content>
    </div>

    <input
      [type]="type"
      [name]="name"
      [id]="id"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="updateValue($event)"
      (blur)="markAsTouched()"
      class="input" />
  </div>
</div>
